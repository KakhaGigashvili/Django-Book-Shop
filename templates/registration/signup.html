{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Sign Up - BookNest{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1>Sign Up</h1>
        <p>Open your account and recive a <strong>and Get 10% discount</strong>.</p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-primary" type="submit">Sign Up</button>
        </form>
    </div>
</div>
{% endblock content %}
